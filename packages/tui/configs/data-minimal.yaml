# Minimax Code M1 data-generation baseline.
# Run it with an isolated MINIMAX_DATA_DIR so user, workspace, Plugin, and
# configured MCP state from a Desktop profile cannot enter the capability set.
agents:
  default:
    persona:
      enabled: false
    tools: [read, write, edit, bash, grep, glob]
    builtinTools: []
    skills: []
    features:
      mavis: false
      delegation: false
      webSearch: false

memory:
  enabled: false
  proactive: false

askUser:
  enabled: false

skills:
  external:
    enabled: false

skillEvolve:
  enabled: false

beta:
  autoMemory: false
  skillEvolve: false
  skillEvolveBuiltinMr: false
  skillProposal: false
  browserBridge: false
  filePanelBrowser: false
  filePanelBrowserMultiTab: false
  browserUseTooling: false
  browserAgentCursor: false
  desktopPlanMode: false
  peek: false
  keepAlive: false
  promptOverride: false
  cuMode: false
  asr: false
  taskHistoryProjectGrouping: false
  threadGoal: false
  mcodeTools: false
  codexOAuth: false
  # PTC now defaults on outside the public production build; this baseline keeps native tools.
  ptc: false
  # Saved run_code script files follow the same rollout as ptc; this baseline keeps them off too.
  ptcScripts: false
  # The run_code session store follows the same rollout as ptc; this baseline keeps it off too.
  ptcStore: false
  pluginMarketplaces: false
  advisor: false
  reviewStatus: false
