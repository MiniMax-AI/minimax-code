name: Usage question
description: Ask about the Desktop app, CLI, or building from source.
title: "[Question]: "
labels: ["question"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product or interface
      description: Desktop app and interactive TUI reports automatically receive the desktop or tui label.
      options:
        - Desktop app
        - CLI - interactive TUI
        - CLI - headless
        - CLI - ACP
        - Source build or repository tooling
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - WSL
        - Multiple platforms
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Version and what you have tried
      description: Include documentation you followed and relevant redacted output. Do not include keys or account data.
    validations:
      required: true
