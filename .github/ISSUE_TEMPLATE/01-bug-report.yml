name: Bug report
description: Report a reproducible problem with the Desktop app, CLI, or source build.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Remove credentials, private code, account details, and sensitive paths. Report vulnerabilities privately using SECURITY.md.
  - type: dropdown
    id: product
    attributes:
      label: Product or interface
      description: Desktop app and interactive TUI reports automatically receive the desktop or tui label.
      options:
        - Desktop app
        - CLI - interactive TUI
        - CLI - headless
        - CLI - ACP
        - Source build or repository tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Desktop Settings version, mcode --version, or source commit. For source builds, also include Node.js and pnpm versions.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - WSL
        - Multiple platforms
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and architecture
      placeholder: "Example: Windows 11 x64, macOS 15 arm64, Ubuntu 24.04 x64"
    validations:
      required: true
  - type: dropdown
    id: issue-area
    attributes:
      label: Issue area
      options:
        - Startup / install / update
        - Agent stuck / slow / repeated loop
        - Tool call / permission / sandbox
        - MCP / OAuth / integration
        - File / workspace / path / encoding
        - Model output quality
        - UI / UX
        - Build / CI / source distribution
        - Other
    validations:
      required: true
  - type: input
    id: upload-id
    attributes:
      label: Desktop log upload ID (optional)
      description: For Desktop only, include an existing ID from Settings → General → Upload logs if available. CLI and source-build reports do not require an upload. Do not paste account credentials or raw session files.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example. For CLI tasks, include permission mode, provider type, and the command without keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted error summary
      description: Only include the relevant excerpt after removing credentials, account details, private paths, and project content.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Attach redacted screenshots here, outside the code-formatted error field.
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues.
          required: true
        - label: I have included my version and removed sensitive information.
          required: true
